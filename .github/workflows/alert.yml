name: market-alert

on:
  schedule:
    # 兜底：每 5 分钟检查一次（cron-job.org 另会每分钟触发一次）
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: market-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 状态存进 Actions 缓存，避免每分钟往仓库提交一次 state.json
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: alerts/state.json
          key: market-alert-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            market-alert-state-

      - name: Run market check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerts/check.py
