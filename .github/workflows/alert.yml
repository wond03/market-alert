name: market-alert

on:
  schedule:
    # 每 5 分钟检查一次（GitHub 的 cron 最小间隔；高峰可能延迟几分钟）
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run market check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerts/check.py

      - name: Commit alert state
        run: |
          git config user.name "market-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alerts/state.json
          git diff --quiet --cached || git commit -m "chore: update alert state"
          git push
