<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="google" content="notranslate" />
<title translate="no">BTC / XAU 合约看盘</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b22; --border: #232a33; --text: #d1d9e0;
    --muted: #7d8590; --up: #26a69a; --down: #ef5350; --accent: #2962ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 7px 12px; border-bottom: 1px solid var(--border); flex: none;
    background: rgba(14,17,23,0.94); backdrop-filter: blur(6px); z-index: 10; flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .group { display: flex; align-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .group .lbl { font-size: 11px; color: var(--muted); padding: 0 6px 0 4px; }
  .group button { background: transparent; color: var(--muted); border: 0; padding: 5px 10px;
    border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .group button.active { background: var(--accent); color: #fff; }
  .group button:hover:not(.active) { color: var(--text); }
  .btn-settings { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .btn-settings:hover { border-color: var(--accent); }
  .tf-select { display: none; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 8px; font-size: 12px; font-weight: 600; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 6px var(--up); }
  .dot.off { background: var(--down); box-shadow: 0 0 6px var(--down); }
  main { flex: 1; min-height: 0; display: flex; padding: 8px 10px; }
  .panel { display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow-y: auto; flex-direction: column; flex: 1; min-height: 0; }
  .panel.active { display: flex; }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 6px 12px 4px; flex-wrap: wrap; flex: none; }
  .sym { font-size: 12px; font-weight: 700; }
  .sym small { font-size: 10px; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .price { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chg { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }
  .stats { display: flex; gap: 10px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .stats b { color: var(--text); font-weight: 600; margin-left: 2px; }
  .main-wrap { position: relative; flex: 1; min-height: 200px; display: flex; flex-direction: column; background: var(--panel); }
  .chart-main { position: relative; z-index: 1; width: 100%; flex: 1; min-height: 0; touch-action: none; }
  .sessions-overlay { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .sbox { position: absolute; box-sizing: border-box; }
  .slabel { position: absolute; font-size: 10px; font-weight: 600; white-space: nowrap; text-shadow: 0 0 3px rgba(0,0,0,0.9); }
  .sline { position: absolute; height: 0; border-top: 1px dashed; }
  .snode { position: absolute; font-size: 9px; white-space: nowrap; }
  .ohlc-fill { position: absolute; box-sizing: border-box; pointer-events: none; }
  .ohlc-line { position: absolute; height: 0; pointer-events: none; }
  .ohlc-label { position: absolute; font-size: 10px; font-weight: 600; white-space: nowrap; text-shadow: 0 0 3px rgba(0,0,0,0.9); pointer-events: none; }
  .scale-btns { position: absolute; right: 5px; bottom: 4px; display: flex; flex-direction: row; gap: 8px; z-index: 5; }
  .scale-btns button { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--border); background: rgba(22,27,34,0.85); color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; line-height: 1; padding: 0; }
  .scale-btns button:hover { color: var(--text); }
  .scale-btns button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chart-sub { width: 100%; height: 120px; flex: none; border-top: 1px solid var(--border); touch-action: none; }
  footer { text-align: center; color: var(--muted); font-size: 10px; padding: 4px 0 6px; flex: none; }
  @media (max-width: 720px) {
    header h1 { display: none; }
    header { padding: 6px 8px; gap: 6px; }
    #tfGroup { display: none; }
    .tf-select { display: block; }
    .group { padding: 2px; }
    .group button { padding: 4px 8px; font-size: 11px; }
    .btn-settings { padding: 5px 10px; font-size: 11px; }
    #statusText { display: none; }
    .stats { display: none; }
    .panel-head { padding: 5px 8px 3px; gap: 6px; }
    main { padding: 6px; }
    footer { display: none; }
  }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .mask.show { display: flex; }
  .modal { background: #161b22; border: 1px solid var(--border); border-radius: 12px; width: 560px; max-width: 100%; max-height: 86vh; display: flex; flex-direction: column; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .modal-head span { font-weight: 700; }
  .modal-head .actions { display: flex; gap: 8px; }
  .modal-head button { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .modal-head button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal-body { padding: 8px 18px 18px; overflow-y: auto; }
  .ind-row { border-bottom: 1px solid var(--border); padding: 9px 0; }
  .ind-row:last-child { border-bottom: 0; }
  .ind-title { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; user-select: none; }
  .ind-title input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .ind-title em { font-style: normal; font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
  .caret { margin-left: auto; font-size: 10px; color: var(--muted); transition: transform .15s; }
  .caret::before { content: "\25B8"; }
  .ind-row:not(.collapsed) > .ind-title > .caret { transform: rotate(90deg); }
  .ind-row.collapsed > .ind-body { display: none; }
  .params { margin: 8px 0 0 24px; }
  .params label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .params input { width: 64px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
  .params select { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
  .params input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); padding: 0; }
  .params input[type="color"] { width: 42px; height: 26px; padding: 1px; }
  .params input[type="time"] { width: 96px; }
  .params input[type="text"] { width: 160px; }
  .param-group { width: 100%; font-size: 12px; font-weight: 700; color: var(--text); margin: 10px 0 0; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .param-box { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 0; }
  /* 警报设置 */
  .alert-sec { margin-top: 14px; }
  .alert-sec-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  #alertBody label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .rule-form { display: flex; flex-wrap: wrap; gap: 10px 14px; }
  .rule-form input, .rule-form select { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
  .rule-form input[type="number"] { width: 84px; }
  .rule-form input[type="text"] { width: 120px; }
  .rule-form input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); }
  .rf-actions { width: 100%; display: flex; gap: 8px; margin-top: 4px; }
  .rf-actions button, .rule-ops button { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .rf-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #alertSecret { width: 150px; }
  .rule-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .rule-row:last-child { border-bottom: 0; }
  .rule-desc { font-size: 12px; }
  .rule-desc b { color: var(--muted); font-weight: 600; }
  .rule-ops { display: flex; gap: 6px; flex: none; }
  .rule-ops button.on { color: #4caf50; border-color: #2e5a33; }
  .rule-ops button.off { color: var(--muted); }
  .alert-empty { color: var(--muted); font-size: 12px; padding: 6px 0; }
  .alert-item { font-size: 12px; color: var(--muted); padding: 4px 0; border-bottom: 1px solid var(--border); }
  .alert-item:last-child { border-bottom: 0; }
  .alert-item b { color: var(--text); font-weight: 600; }
  .alert-msg { font-size: 12px; margin-left: 6px; }
  .alert-msg.err { color: #ff6b6b; }
  .alert-msg.ok { color: #4caf50; }
</style>
</head>
<body class="notranslate">
<header>
  <h1>合约看盘 · BTC / XAU</h1>
  <div class="toolbar">
    <div class="group" id="tabs"></div>
    <div class="group" id="exGroup"></div>
    <div class="group" id="tfGroup"></div>
    <select id="tfSelect" class="tf-select"></select>
    <button class="btn-settings" id="btnSettings">指标设置</button>
    <button class="btn-settings" id="btnAlert">警报设置</button>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">连接中…</span></div>
  </div>
</header>
<main id="main"></main>
<footer>数据来源：Gate / WEEX / OKX 永续合约公开接口（自用）。行情仅供参考，不构成投资建议。</footer>

<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-head">
      <span>指标设置</span>
      <div class="actions">
        <button id="btnReset">重置默认</button>
        <button class="primary" id="btnClose">完成</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="mask" id="alertMask">
  <div class="modal">
    <div class="modal-head">
      <span>警报设置</span>
      <div class="actions">
        <button class="primary" id="alertClose">完成</button>
      </div>
    </div>
    <div class="modal-body" id="alertBody">
      <div class="alert-sec">
        <label>写入口令 <input id="alertSecret" type="password" placeholder="RULES_SECRET"><span class="alert-msg" id="alertMsg"></span></label>
      </div>
      <div class="alert-sec">
        <div class="alert-sec-title">新增 / 编辑规则</div>
        <div class="rule-form">
          <label>交易所 <select id="rfExchange"><option value="gate">Gate</option><option value="weex">WEEX</option><option value="okx">OKX</option></select></label>
          <label>品种 <select id="rfSymbol"><option value="BTC">BTC/USDT</option><option value="XAU">XAU/USDT</option></select></label>
          <label>类型 <select id="rfType"><option value="cross_up">价格上破</option><option value="cross_down">价格下破</option><option value="breakout">突破</option></select></label>
          <label class="rf-price">价位 <input id="rfPrice" type="number" step="any" placeholder="如 80000"></label>
          <label class="rf-break">指标 <select id="rfIndicator"><option value="prev_ohlc">前N根K线</option><option value="prev_session">前一时段</option></select></label>
          <label class="rf-break rf-tf">周期 <select id="rfTf"><option value="15m">15分钟</option><option value="1h">1小时</option><option value="4h">4小时</option><option value="1d">日</option></select></label>
          <label class="rf-break rf-tf">偏移 <input id="rfOffset" type="number" min="1" step="1" value="2"></label>
          <label class="rf-break">取 <select id="rfField"><option value="high">前高</option><option value="low">前低</option></select></label>
          <label class="rf-break">方向 <select id="rfDir"><option value="up">上破</option><option value="down">下破</option></select></label>
          <label>备注 <input id="rfLabel" type="text" placeholder="自动"></label>
          <label>启用 <input id="rfEnabled" type="checkbox" checked></label>
          <div class="rf-actions">
            <button class="primary" id="rfSave">添加规则</button>
            <button id="rfCancel" style="display:none">取消编辑</button>
          </div>
        </div>
      </div>
      <div class="alert-sec">
        <div class="alert-sec-title">现有规则</div>
        <div id="ruleList"><div class="alert-empty">加载中…</div></div>
      </div>
      <div class="alert-sec">
        <div class="alert-sec-title">最近触发</div>
        <div id="alertList"><div class="alert-empty">加载中…</div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
  "use strict";

  var BARS = 400;

  var INSTRUMENTS = [
    { label: "BTC/USDT", sub: "永续", sym: { gate: "BTC_USDT", weex: "BTCUSDT", okx: "BTC-USDT-SWAP" } },
    { label: "XAU/USDT", sub: "永续", sym: { gate: "XAU_USDT", weex: "XAUUSDT", okx: "XAU-USDT-SWAP" } }
  ];
  var INTERVALS = [
    { key: "1m", label: "1分" }, { key: "5m", label: "5分" },
    { key: "15m", label: "15分" }, { key: "1h", label: "1时" },
    { key: "4h", label: "4时" }, { key: "1d", label: "日" }
  ];
  /* TradingView 默认配色 */
  var COL = {
    up: "#26a69a", down: "#ef5350",
    m1: "#2962FF", m2: "#FF6D00", m3: "#F23645",
    bollUp: "#787B86", bollMid: "#FF6D00", bollLow: "#787B86",
    macd: "#2962FF", signal: "#FF6D00",
    rsi: "#7E57C2", k: "#2962FF", d: "#FF6D00", j: "#7E57C2",
    guide: "rgba(120,123,134,0.6)"
  };
  var SOURCE_OPTS = [
    { value: "close", label: "收盘价 close" },
    { value: "open", label: "开盘价 open" },
    { value: "high", label: "最高价 high" },
    { value: "low", label: "最低价 low" },
    { value: "hl2", label: "(high+low)/2" },
    { value: "hlc3", label: "(high+low+close)/3" },
    { value: "ohlc4", label: "(open+high+low+close)/4" }
  ];
  var MATYPE_OPTS = [
    { value: "SMA", label: "SMA 简单" },
    { value: "EMA", label: "EMA 指数" },
    { value: "WMA", label: "WMA 加权" },
    { value: "RMA", label: "RMA 平滑(Wilder)" }
  ];
  var LINE_STYLE_OPTS = [
    { value: "solid", label: "实线" },
    { value: "dashed", label: "虚线" },
    { value: "dotted", label: "点线" }
  ];

  var state = { exchange: "gate", interval: "15m", activeInst: 0 };

  /* ================= 交易所适配器 ================= */
  /* 统一输出：candle = { time(秒), open, high, low, close, volume }
               tick   = { contract, last, changePct, high24, low24, vol24(USDT), index }
     新增交易所：在 EXCHANGES 加一条，并在 INSTRUMENTS[].sym 补上该所代码即可。 */
  var EXCHANGE_ORDER = ["gate", "weex", "okx"];
  var EXCHANGES = {
    gate: {
      label: "Gate", maxBars: 400,
      interval: function (iv) { return iv; },
      wsUrl: "wss://fx-ws.gateio.ws/v4/ws/usdt",
      fetchCandles: function (contract, iv, limit) {
        var url = "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=" +
          contract + "&interval=" + iv + "&limit=" + limit;
        return fetch(url, { cache: "no-store" }).then(okJson).then(function (raw) {
          return (raw || []).map(function (c) {
            return { time: Math.floor(Number(c.t)), open: +c.o, high: +c.h, low: +c.l, close: +c.c, volume: +c.v };
          }).filter(validCandle);
        });
      },
      onOpen: function (send, contracts, iv) {
        send({ time: nowSec(), channel: "futures.tickers", event: "subscribe", payload: contracts });
        contracts.forEach(function (k) {
          send({ time: nowSec(), channel: "futures.candlesticks", event: "subscribe", payload: [iv, k] });
        });
      },
      onUnsubCandles: function (send, contracts, iv) {
        contracts.forEach(function (k) {
          send({ time: nowSec(), channel: "futures.candlesticks", event: "unsubscribe", payload: [iv, k] });
        });
      },
      onMessage: function (msg, h) {
        if (msg.event !== "update") return;
        if (msg.channel === "futures.tickers") {
          (msg.result || []).forEach(function (t) {
            h.tick({ contract: t.contract, last: +t.last, changePct: +t.change_percentage,
              high24: +t.high_24h, low24: +t.low_24h, vol24: +t.volume_24h_settle, index: +t.index_price });
          });
        } else if (msg.channel === "futures.candlesticks") {
          (msg.result || []).forEach(function (c) {
            var name = String(c.n || ""), us = name.indexOf("_");
            if (us < 0) return;
            if (name.slice(0, us) !== state.interval) return;
            h.candle({ contract: name.slice(us + 1), time: Math.floor(Number(c.t)),
              open: +c.o, high: +c.h, low: +c.l, close: +c.c, volume: +c.v });
          });
        }
      }
    },
    weex: {
      label: "WEEX", maxBars: 400,
      interval: function (iv) { return iv; },
      wsUrl: "wss://ws-contract.weex.com/v3/ws/public",
      fetchCandles: function (contract, iv, limit) {
        var url = "https://api-contract.weex.com/capi/v3/market/klines?symbol=" +
          contract + "&interval=" + iv + "&limit=" + limit;
        return fetch(url, { cache: "no-store" }).then(okJson).then(function (raw) {
          return (raw || []).map(function (r) {
            return { time: Math.floor(Number(r[0]) / 1000), open: +r[1], high: +r[2], low: +r[3], close: +r[4], volume: +r[5] };
          }).filter(validCandle);
        });
      },
      onOpen: function (send, contracts, iv) {
        var params = [];
        contracts.forEach(function (k) { params.push(k + "@ticker"); });
        contracts.forEach(function (k) { params.push(k + "@kline_" + iv + "_LAST_PRICE"); });
        send({ method: "SUBSCRIBE", params: params, id: 1 });
      },
      onUnsubCandles: function (send, contracts, iv) {
        send({ method: "UNSUBSCRIBE", params: contracts.map(function (k) { return k + "@kline_" + iv + "_LAST_PRICE"; }), id: 2 });
      },
      onMessage: function (msg, h) {
        if (msg.e === "ticker" && msg.d && msg.d[0]) {
          var d = msg.d[0];
          /* WEEX 的 P 是涨跌幅比例（0.0129=1.29%），需乘 100 */
          h.tick({ contract: msg.s, last: +d.c, changePct: +d.P * 100, high24: +d.h, low24: +d.l, vol24: +d.q, index: +d.i });
        } else if ((msg.e === "kline" || msg.e === "klineSnapshot") && msg.d) {
          var want = EXCHANGES.weex.interval(state.interval);
          msg.d.forEach(function (c) {
            if (String(c.i) !== want) return;
            h.candle({ contract: msg.s, time: Math.floor(Number(c.t)), open: +c.o, high: +c.h, low: +c.l, close: +c.c, volume: +c.v });
          });
        }
      }
    },
    okx: {
      label: "OKX", maxBars: 300, ping: true,
      interval: function (iv) { return ({ "1m": "1m", "5m": "5m", "15m": "15m", "1h": "1H", "4h": "4H", "1d": "1D" })[iv] || iv; },
      wsUrl: "wss://ws.okx.com:8443/ws/v5/public",
      fetchCandles: function (contract, iv, limit) {
        var url = "https://www.okx.com/api/v5/market/candles?instId=" +
          encodeURIComponent(contract) + "&bar=" + iv + "&limit=" + limit;
        return fetch(url, { cache: "no-store" }).then(okJson).then(function (res) {
          if (!res || res.code !== "0" || !res.data) return [];
          return res.data.map(function (r) {
            return { time: Math.floor(Number(r[0]) / 1000), open: +r[1], high: +r[2], low: +r[3], close: +r[4], volume: +r[5] };
          }).reverse().filter(validCandle);
        });
      },
      onOpen: function (send, contracts, iv) {
        var args = [];
        contracts.forEach(function (k) { args.push({ channel: "tickers", instId: k }); });
        contracts.forEach(function (k) { args.push({ channel: "candle" + iv, instId: k }); });
        send({ op: "subscribe", args: args });

        var w = x1 - x0;
        if (w < 0.5) return;

        var first = d[r.i0], last = d[r.i1], sum = 0, hh = -Infinity, ll = Infinity;
        for (var k = r.i0; k <= r.i1; k++) { sum += d[k].close; if (d[k].high > hh) hh = d[k].high; if (d[k].low < ll) ll = d[k].low; }
        var avg = sum / (r.i1 - r.i0 + 1);

        var yA = null, yB = null;
        try { yA = entry.candles.priceToCoordinate(hh); } catch (e) {}
        try { yB = entry.candles.priceToCoordinate(ll); } catch (e) {}
        if (yA === null || yB === null || !isFinite(yA) || !isFinite(yB)) return;
        var yTop = Math.min(yA, yB), yBot = Math.max(yA, yB);
        yTop = Math.max(0, yTop); yBot = Math.min(boxH, yBot);
        var bh = yBot - yTop;
        if (bh < 1) return;

        var box = document.createElement("div");
        box.className = "sbox";
        box.style.left = x0 + "px"; box.style.top = yTop + "px";
        box.style.width = w + "px"; box.style.height = bh + "px";
        box.style.background = fill;
        el.appendChild(box);
        if (p.showName) {
          var lb = document.createElement("div");
          lb.className = "slabel"; lb.textContent = se.name; lb.style.color = se.color;
          var lop = Number(p.labelOpacity);
          if (!isFinite(lop)) lop = 100;
          lop = Math.max(0, Math.min(100, lop));
          lb.style.opacity = (lop / 100);
          var ly = yBot + 2;
          if (ly + 13 > boxH) ly = yTop - 13;
          if (ly < 0) ly = yBot + 2;
          lb.style.left = (x0 + 4) + "px"; lb.style.top = ly + "px";
          el.appendChild(lb);
        }
        function addLine(price) {
          var y = null;
          try { y = entry.candles.priceToCoordinate(price); } catch (e) {}
          if (y === null || !isFinite(y) || y < yTop || y > yBot) return;
          var ln = document.createElement("div");
          ln.className = "sline";
          ln.style.left = x0 + "px"; ln.style.width = w + "px";
          ln.style.top = y + "px"; ln.style.borderTopColor = se.color;
          el.appendChild(ln);
        }
        if (p.showOC) { addLine(first.open); addLine(last.close); }
        if (p.showAvg) addLine(avg);

        if (p.showAvg || p.showRange) {
          var txt = [];
          if (p.showAvg) txt.push("均 " + fmt(avg, 2));
          if (p.showRange) txt.push("区间 " + fmt(hh - ll, 2));
          var nd = document.createElement("div");
          nd.className = "snode"; nd.textContent = txt.join("   ");
          nd.style.color = se.color; nd.style.left = (x0 + 4) + "px"; nd.style.top = yTop + "px";
          el.appendChild(nd);
        }
      });
    });
  }

  /* ================= previous OHLC (前一时段 O/H/L/C) ================= */
  var TF_SECONDS = { "15m": 900, "1h": 3600, "4h": 14400, "1d": 86400 };
  var INTERVAL_SECONDS = { "1m": 60, "5m": 300, "15m": 900, "1h": 3600, "4h": 14400, "1d": 86400 };
  var OHLC_LABELS = { open: "开", high: "高", low: "低", close: "收" };

  function aggregatePeriods(data, secs) {
    var out = [], cur = null;
    for (var i = 0; i < data.length; i++) {
      var key = Math.floor((data[i].time + BJ_OFFSET) / secs);
      if (!cur || cur.key !== key) {
        if (cur) out.push(cur);
        cur = { key: key, i0: i, i1: i, open: data[i].open, high: data[i].high, low: data[i].low, close: data[i].close };
      } else {
        cur.i1 = i;
        if (data[i].high > cur.high) cur.high = data[i].high;
        if (data[i].low < cur.low) cur.low = data[i].low;
        cur.close = data[i].close;
      }
    }
    if (cur) out.push(cur);
    return out;
  }

  function drawOHLC(entry) {
    var el = entry.ohlcEl;
    if (!el) return;
    el.innerHTML = "";
    if (!entry.ohlcOn) return;
    var d = entry.data;
    if (!d || d.length < 2) return;
    var p = active.prevOHLC.params;

    var tf = TF_SECONDS[p.tf] ? p.tf : "1d";
    var secs = TF_SECONDS[tf];
    var chartSecs = INTERVAL_SECONDS[state.interval] || 900;
    if (chartSecs > secs) return; // 图表周期比目标周期更粗，无法聚合

    var periods = aggregatePeriods(d, secs);
    if (!periods.length) return;
    var off = Math.max(1, parseInt(p.offset, 10) || 1);
    var shift = off - 1; // 用第 (k-shift) 个周期的数值，画在第 k 个周期的时间段上

    var ts = entry.mainChart.timeScale();
    var vr = null;
    try { vr = ts.getVisibleLogicalRange(); } catch (e) {}
    if (!vr) return;
    var plotW = ts.width ? ts.width() : entry.mainWrap.clientWidth;
    var axisH = 0;
    try { axisH = ts.height() || 0; } catch (e) {}
    var boxH = entry.mainWrap.clientHeight - axisH;
    if (boxH <= 0) boxH = entry.mainWrap.clientHeight;
    function coord(i) { try { var c = ts.logicalToCoordinate(i); return (c === null || !isFinite(c)) ? null : c; } catch (e) { return null; } }
    function yOf(v) { try { var y = entry.candles.priceToCoordinate(v); return (y === null || !isFinite(y)) ? null : y; } catch (e) { return null; } }

    var fo = Number(p.fillOpacity);
    if (!isFinite(fo)) fo = 80;
    fo = Math.max(0, Math.min(100, fo));
    var fill = hexToRgba(p.fillColor || "#c0c0c0", fo / 100);

    // 收集所有可见周期（每个周期一组 O/H/L/C）
    var items = [];
    for (var k = 0; k < periods.length; k++) {
      var per = periods[k];
      if (per.i1 < vr.from || per.i0 > vr.to) continue;
      var src = periods[k - shift];
      if (!src) continue;
      var c0 = coord(per.i0), c1 = coord(per.i1), cn = coord(per.i0 + 1), bs = null;
      if (cn !== null && c0 !== null) bs = cn - c0;
      else if (c0 !== null && c1 !== null && per.i1 > per.i0) bs = (c1 - c0) / (per.i1 - per.i0);
      if (bs === null || !isFinite(bs) || bs <= 0) bs = plotW / Math.max(1, vr.to - vr.from);
      var x0 = (per.i0 < vr.from) ? 0 : (c0 === null ? 0 : c0 - bs / 2);
      var x1 = (per.i1 + 1 > vr.to) ? plotW : (c1 === null ? plotW : c1 + bs / 2);
      x0 = Math.max(0, x0); x1 = Math.min(plotW, x1);
      if (p.extend) x1 = plotW;
      if (x1 - x0 < 0.5) continue;
      items.push({ x0: x0, x1: x1, src: src });
    }
    if (!items.length) return;

    // 先画填充（高~低区间），再画线，避免相邻填充盖住线
    if (p.fillOn) {
      items.forEach(function (it) {
        var yh = yOf(it.src.high), yl = yOf(it.src.low);
        if (yh === null || yl === null) return;
        var yTop = Math.max(0, Math.min(yh, yl));
        var yBot = Math.min(boxH, Math.max(yh, yl));
        if (yBot - yTop < 1) return;
        var fdiv = document.createElement("div");
        fdiv.className = "ohlc-fill";
        fdiv.style.left = it.x0 + "px"; fdiv.style.width = (it.x1 - it.x0) + "px";
        fdiv.style.top = yTop + "px"; fdiv.style.height = (yBot - yTop) + "px";
        fdiv.style.background = fill;
        el.appendChild(fdiv);
      });
    }

    var KEYS = ["open", "high", "low", "close"].filter(function (k) { return p[k + "On"] !== false; });
    function lineStyle(key) {
      var sv = String(p[key + "Style"] || "solid");
      return sv === "dashed" ? "dashed" : (sv === "dotted" ? "dotted" : "solid");
    }
    items.forEach(function (it) {
      KEYS.forEach(function (key) {
        var y = yOf(it.src[key]);
        if (y === null) return;
        var ldiv = document.createElement("div");
        ldiv.className = "ohlc-line";
        ldiv.style.left = it.x0 + "px"; ldiv.style.width = (it.x1 - it.x0) + "px";
        ldiv.style.top = y + "px";
        ldiv.style.borderTopWidth = Math.max(1, parseInt(p[key + "Width"], 10) || 1) + "px";
        ldiv.style.borderTopStyle = lineStyle(key);
        ldiv.style.borderTopColor = p[key + "Color"] || "#888888";
        el.appendChild(ldiv);
      });
    });

    // 标签只标最后一个周期，避免刷屏
    if (p.showLabel && items.length) {
      var last = items[items.length - 1];
      KEYS.forEach(function (key) {
        var y = yOf(last.src[key]);
        if (y === null) return;
        var lab = document.createElement("div");
        lab.className = "ohlc-label";
        lab.textContent = OHLC_LABELS[key] + " " + fmt(last.src[key], priceDp(last.src[key]));
        lab.style.color = p[key + "Color"] || "#888888";
        lab.style.left = (last.x0 + 3) + "px"; lab.style.top = (y - 13) + "px";
        el.appendChild(lab);
      });
    }
  }

  function redrawOverlays(entry) {
    if (entry.sessionsOn) drawSessions(entry);
    drawOHLC(entry);
  }

  function buildIndicators(entry) {
    var range = null;
    try { range = entry.mainChart.timeScale().getVisibleLogicalRange(); } catch (e) {}

    (entry.mainOverlays || []).forEach(function (o) { o.series.forEach(function (s) { try { entry.mainChart.removeSeries(s); } catch (e) {} }); });
    entry.mainOverlays = [];
    (entry.subPanes || []).forEach(function (sp) { try { sp.chart.remove(); } catch (e) {} });
    entry.subContainer.innerHTML = "";
    entry.subPanes = [];
    if (entry.sessionsEl) { entry.sessionsEl.innerHTML = ""; entry.sessionsOn = false; }
    if (entry.ohlcEl) { entry.ohlcEl.innerHTML = ""; entry.ohlcOn = false; }

    Object.keys(IND).forEach(function (key) {
      var def = IND[key];
      if (def.pane === "main") {
        if (def.type === "sessions") { if (active[key].on) entry.sessionsOn = true; return; }
        if (def.type === "prevOHLC") { if (active[key].on) entry.ohlcOn = true; return; }
        if (!active[key].on) return;
        var series = def.series.map(function (sp) { return makeSeries(entry.mainChart, sp); });
        entry.mainOverlays.push({ def: def, key: key, series: series });
      } else {
        if (!active[key].on) return;
        var el = document.createElement("div");
        el.className = "chart-sub";
        entry.subContainer.appendChild(el);
        var chart = LightweightCharts.createChart(el, Object.assign({}, BASE_SUB, { width: el.clientWidth || 600, height: el.clientHeight || 120 }));
        var s2 = def.series.map(function (sp) { return makeSeries(chart, sp); });
        (function (el2, chart2) {
          new ResizeObserver(function () { if (el2.clientWidth > 0) chart2.applyOptions({ width: el2.clientWidth, height: el2.clientHeight }); }).observe(el2);
        })(el, chart);
        syncPair(entry.mainChart, chart);
        entry.subPanes.push({ def: def, key: key, chart: chart, series: s2, el: el });
      }
    });

    applyIndicatorData(entry);
    if (range) { try { entry.mainChart.timeScale().setVisibleLogicalRange(range); } catch (e) {} }
    redrawOverlays(entry);
  }

  function applyIndicatorData(entry) {
    var d = entry.data;
    if (!d || !d.length) return;
    entry.mainOverlays.forEach(function (o) {
      var data = o.def.calc(d, active[o.key].params);
      o.series.forEach(function (s, i) { s.setData(data[i] || []); });
    });
    entry.subPanes.forEach(function (sp) {
      var data = sp.def.calc(d, active[sp.key].params);
      sp.series.forEach(function (s, i) { s.setData(data[i] || []); });
    });
  }

  function rebuildAllIndicators() { charts.forEach(buildIndicators); saveActive(); }

  /* ================= data ================= */
  function fmt(n, dp) {
    if (n === null || n === undefined || isNaN(n)) return "--";
    var d = dp === undefined ? 2 : dp;
    return Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function priceDp(p) { if (p >= 1000) return 1; if (p >= 1) return 2; return 5; }

  function validCandle(c) {
    return c && isFinite(c.time) && isFinite(c.close) && c.time > 0;
  }
  function okJson(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
  /* 统一按时间升序并去重（各交易所返回顺序不一致，如 WEEX 会乱序） */
  function sortCandles(arr) {
    var list = (arr || []).filter(validCandle).sort(function (a, b) { return a.time - b.time; });
    var out = [];
    for (var i = 0; i < list.length; i++) {
      if (out.length && out[out.length - 1].time === list[i].time) out[out.length - 1] = list[i];
      else out.push(list[i]);
    }
    return out;
  }

  function loadCandles(entry) {
    var ex = EXCHANGES[state.exchange];
    var contract = entry.inst.sym[state.exchange];
    var iv = ex.interval(state.interval);
    var limit = Math.min(BARS, ex.maxBars || BARS);
    var gen = state.exchange + "|" + state.interval;
    return ex.fetchCandles(contract, iv, limit).then(function (data) {
      if (gen !== state.exchange + "|" + state.interval) return; // 已切换交易所/周期，丢弃过期响应
      entry.data = sortCandles(data);
      entry.candles.setData(entry.data);
      applyIndicatorData(entry);
      try { entry.mainChart.timeScale().fitContent(); } catch (e) {}
      redrawOverlays(entry);
    });
  }

  /* ================= 实时数据（各交易所 WebSocket） ================= */
  var ws = null, wsReady = false, wsRetry = 0, wsReconnectTimer = null, wsConnExchange = null, wsPingTimer = null;

  function nowSec() { return Math.floor(Date.now() / 1000); }
  function curEx() { return EXCHANGES[state.exchange]; }
  function contracts() { return INSTRUMENTS.map(function (i) { return i.sym[state.exchange]; }); }
  function findEntry(contract) {
    var want = String(contract || "").toLowerCase();
    for (var i = 0; i < charts.length; i++) {
      if (String(charts[i].inst.sym[state.exchange] || "").toLowerCase() === want) return charts[i];
    }
    return null;
  }
  function wsSend(obj) { if (ws && ws.readyState === 1) ws.send(typeof obj === "string" ? obj : JSON.stringify(obj)); }

  function applyTicker(t) {
    var entry = findEntry(t.contract);
    if (!entry || !isFinite(t.last)) return;
    var dp = priceDp(t.last), els = entry.panel;
    els.querySelector('[data-role="price"]').textContent = fmt(t.last, dp);
    var chg = Number(t.changePct);
    if (isFinite(chg)) {
      var chgEl = els.querySelector('[data-role="chg"]');
      chgEl.textContent = (chg >= 0 ? "+" : "") + fmt(chg, 2) + "%";
      chgEl.className = "chg " + (chg >= 0 ? "up" : "down");
    }
    els.querySelector('[data-role="high"]').textContent = isFinite(t.high24) ? fmt(t.high24, dp) : "--";
    els.querySelector('[data-role="low"]').textContent = isFinite(t.low24) ? fmt(t.low24, dp) : "--";
    els.querySelector('[data-role="vol"]').textContent = isFinite(t.vol24) ? fmt(t.vol24 / 1e6, 1) + "M" : "--";
    els.querySelector('[data-role="idx"]').textContent = isFinite(t.index) ? fmt(t.index, dp) : "--";
  }

  function applyCandle(c) {
    var entry = findEntry(c.contract);
    if (!entry) return;
    var candle = {
      time: Number(c.time), open: Number(c.open), high: Number(c.high),
      low: Number(c.low), close: Number(c.close), volume: Number(c.volume)
    };
    if (!isFinite(candle.time) || !isFinite(candle.close)) return;
    var arr = entry.data;
    // lightweight-charts 的 series.update 只接受「最后一根」或更新的蜡烛，
    // 早于最后一根的历史/乱序数据一律丢弃，避免抛 "Cannot update oldest data"。
    if (arr.length && candle.time < arr[arr.length - 1].time) return;
    if (arr.length && candle.time === arr[arr.length - 1].time) arr[arr.length - 1] = candle;
    else arr.push(candle);
    entry.candles.update(candle);
    applyIndicatorData(entry);
    redrawOverlays(entry);
  }

  function onWsMessage(raw) {
    if (typeof raw === "string" && raw === "pong") return;
    if (wsConnExchange !== state.exchange) return; // 忽略切换交易所后旧连接的残留消息
    var msg;
    try { msg = JSON.parse(raw); } catch (e) { return; }
    curEx().onMessage(msg, { tick: applyTicker, candle: applyCandle });
  }

  function setStatus(ok) {
    var dot = document.getElementById("statusDot"), txt = document.getElementById("statusText");
    dot.classList.toggle("off", !ok);
    txt.textContent = ok ? "实时 · " + new Date().toLocaleTimeString("zh-CN") : "连接中断，重连中…";
  }

  function closeWs() {
    if (wsPingTimer) { clearInterval(wsPingTimer); wsPingTimer = null; }
    if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} ws = null; }
    wsReady = false;
  }

  function wsConnect() {
    if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
    var ex = curEx();
    wsConnExchange = state.exchange;
    try { ws = new WebSocket(ex.wsUrl); } catch (e) { scheduleReconnect(); return; }
    ws.onopen = function () {
      wsReady = true; wsRetry = 0; setStatus(true);
      ex.onOpen(wsSend, contracts(), ex.interval(state.interval));
      if (ex.ping) wsPingTimer = setInterval(function () { try { ws.send("ping"); } catch (e) {} }, 20000);
    };
    ws.onmessage = function (e) { onWsMessage(e.data); };
    ws.onclose = function () { wsReady = false; setStatus(false); if (wsPingTimer) { clearInterval(wsPingTimer); wsPingTimer = null; } scheduleReconnect(); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  function scheduleReconnect() {
    wsRetry++;
    var delay = Math.min(30000, 1000 * Math.pow(2, Math.min(wsRetry, 5)));
    wsReconnectTimer = setTimeout(wsConnect, delay);
  }

  function reloadAll() {
    charts.forEach(function (e) { loadCandles(e).catch(function () {}); });
  }

  /* ================= UI ================= */
  function switchExchange(id) {
    if (state.exchange === id || !EXCHANGES[id]) return;
    state.exchange = id;
    Array.prototype.forEach.call(document.getElementById("exGroup").children, function (b) {
      b.classList.toggle("active", b.dataset.ex === id);
    });
    closeWs();
    reloadAll();
    wsConnect();
  }

  function selectInterval(key) {
    if (state.interval === key) return;
    var old = state.interval;
    state.interval = key;
    Array.prototype.forEach.call(document.getElementById("tfGroup").children, function (c) {
      c.classList.toggle("active", c.dataset.key === key);
    });
    document.getElementById("tfSelect").value = key;
    if (wsReady) {
      var ex = curEx();
      ex.onUnsubCandles(wsSend, contracts(), ex.interval(old));
      ex.onOpen(wsSend, contracts(), ex.interval(key));
    }
    reloadAll();
  }

  function buildToolbar() {
    var exGroup = document.getElementById("exGroup");
    EXCHANGE_ORDER.forEach(function (id) {
      var b = document.createElement("button");
      b.textContent = EXCHANGES[id].label; b.dataset.ex = id;
      if (id === state.exchange) b.classList.add("active");
      b.addEventListener("click", function () { switchExchange(id); });
      exGroup.appendChild(b);
    });

    var tf = document.getElementById("tfGroup");
    var sel = document.getElementById("tfSelect");
    INTERVALS.forEach(function (iv) {
      var b = document.createElement("button");
      b.textContent = iv.label; b.dataset.key = iv.key;
      if (iv.key === state.interval) b.classList.add("active");
      b.addEventListener("click", function () { selectInterval(iv.key); });
      tf.appendChild(b);

      var o = document.createElement("option");
      o.value = iv.key; o.textContent = iv.label;
      sel.appendChild(o);
    });
    sel.value = state.interval;
    sel.addEventListener("change", function () { selectInterval(sel.value); });
    document.getElementById("btnSettings").addEventListener("click", openModal);
    document.getElementById("btnClose").addEventListener("click", closeModal);
    document.getElementById("btnReset").addEventListener("click", function () {
      Object.keys(IND).forEach(function (k) { active[k] = defaultsFor(k); });
      renderModal(); rebuildAllIndicators();
    });
    document.getElementById("mask").addEventListener("click", function (e) { if (e.target.id === "mask") closeModal(); });
  }

  function openModal() { renderModal(); document.getElementById("mask").classList.add("show"); }
  function closeModal() { document.getElementById("mask").classList.remove("show"); }

  function renderModal() {
    var body = document.getElementById("modalBody");
    body.innerHTML = "";

    function makeGroupHeader(gname) {
      var gh = document.createElement("div");
      gh.className = "param-group";
      gh.appendChild(document.createTextNode(gname));
      return gh;
    }

    Object.keys(IND).forEach(function (key) {
      var def = IND[key];
      var row = document.createElement("div");
      row.className = "ind-row" + (uiState.ind[key] === true ? "" : " collapsed");
      var title = document.createElement("div");
      title.className = "ind-title";
      var cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = !!active[key].on;
      cb.addEventListener("click", function (e) { e.stopPropagation(); });
      cb.addEventListener("change", function () { active[key].on = cb.checked; rebuildAllIndicators(); });
      title.appendChild(cb);
      title.appendChild(document.createTextNode(" " + def.name + " "));
      var tag = document.createElement("em");
      tag.textContent = def.pane === "main" ? "主图" : "副图";
      title.appendChild(tag);
      var caret = document.createElement("span"); caret.className = "caret";
      title.appendChild(caret);
      title.addEventListener("click", function () {
        var col = row.classList.toggle("collapsed");
        uiState.ind[key] = !col;
      });
      row.appendChild(title);

      if (def.params && def.params.length) {
        var indBody = document.createElement("div");
        indBody.className = "ind-body";
        var ps = document.createElement("div");
        ps.className = "params";
        var lastGroup, curBox;
        def.params.forEach(function (p) {
          var gname = p.group || "";
          if (curBox === undefined || gname !== lastGroup) {
            lastGroup = gname;
            if (gname) ps.appendChild(makeGroupHeader(gname));
            curBox = document.createElement("div");
            curBox.className = "param-box";
            ps.appendChild(curBox);
          }
          var lab = document.createElement("label");
          var cur = active[key].params[p.key];
          if (p.type === "bool") {
            var cbx = document.createElement("input");
            cbx.type = "checkbox"; cbx.checked = !!cur;
            cbx.addEventListener("change", function () { active[key].params[p.key] = cbx.checked; rebuildAllIndicators(); });
            lab.appendChild(cbx);
            lab.appendChild(document.createTextNode(" " + p.label));
          } else {
            lab.appendChild(document.createTextNode(p.label + " "));
            var ctl;
            if (p.type === "select") {
              ctl = document.createElement("select"); ctl.className = "p-select";
              (p.options || []).forEach(function (o) {
                var opt = document.createElement("option");
                opt.value = o.value; opt.textContent = o.label; ctl.appendChild(opt);
              });
              ctl.value = cur;
              ctl.addEventListener("change", function () { active[key].params[p.key] = ctl.value; rebuildAllIndicators(); });
            } else if (p.type === "color") {
              ctl = document.createElement("input"); ctl.type = "color"; ctl.value = cur;
              ctl.addEventListener("change", function () { active[key].params[p.key] = ctl.value; rebuildAllIndicators(); });
            } else if (p.type === "time") {
              ctl = document.createElement("input"); ctl.type = "time"; ctl.value = cur;
              ctl.addEventListener("change", function () { active[key].params[p.key] = ctl.value; rebuildAllIndicators(); });
            } else if (p.type === "text") {
              ctl = document.createElement("input"); ctl.type = "text"; ctl.value = cur;
              ctl.addEventListener("change", function () { active[key].params[p.key] = ctl.value; rebuildAllIndicators(); });
            } else {
              ctl = document.createElement("input");
              ctl.type = "number"; ctl.step = p.type === "float" ? "0.1" : "1"; ctl.min = "1";
              ctl.value = cur;
              ctl.addEventListener("change", function () {
                var v = parseFloat(ctl.value);
                if (isNaN(v) || v <= 0) { ctl.value = active[key].params[p.key]; return; }
                active[key].params[p.key] = v; rebuildAllIndicators();
              });
            }
            lab.appendChild(ctl);
          }
          curBox.appendChild(lab);
        });
        indBody.appendChild(ps);
        row.appendChild(indBody);
      }
      body.appendChild(row);
    });
  }

  function resizeEntry(entry) {
    var mainEl = entry.panel.querySelector('[data-role="main"]');
    if (mainEl && mainEl.clientWidth > 0) {
      entry.mainChart.applyOptions({ width: mainEl.clientWidth, height: mainEl.clientHeight });
    }
    entry.subPanes.forEach(function (sp) {
      if (sp.el.clientWidth > 0) sp.chart.applyOptions({ width: sp.el.clientWidth, height: sp.el.clientHeight });
    });
    redrawOverlays(entry);
  }

  function setActiveInst(i) {
    state.activeInst = i;
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
      b.classList.toggle("active", Number(b.dataset.idx) === i);
    });
    charts.forEach(function (e, idx) { e.panel.classList.toggle("active", idx === i); });
    var e = charts[i];
    if (e) requestAnimationFrame(function () { resizeEntry(e); });
  }

  function buildTabs() {
    var tabs = document.getElementById("tabs");
    tabs.innerHTML = "";
    INSTRUMENTS.forEach(function (inst, idx) {
      var b = document.createElement("button");
      b.textContent = inst.label.split("/")[0]; b.dataset.idx = idx;
      if (idx === state.activeInst) b.classList.add("active");
      b.addEventListener("click", function () { if (state.activeInst !== idx) setActiveInst(idx); });
      tabs.appendChild(b);
    });
  }

  function buildPanels() {
    var main = document.getElementById("main");
    main.innerHTML = "";
    charts = [];
    INSTRUMENTS.forEach(function (inst, idx) {
      var panel = document.createElement("div");
      panel.className = "panel" + (idx === state.activeInst ? " active" : "");
      panel.innerHTML =
        '<div class="panel-head">' +
          '<span class="sym">' + inst.label + '<small>' + inst.sub + '</small></span>' +
          '<span class="price" data-role="price">--</span>' +
          '<span class="chg" data-role="chg">--</span>' +
          '<span class="stats">' +
            '<span>24H高<b data-role="high">--</b></span>' +
            '<span>24H低<b data-role="low">--</b></span>' +
            '<span>24H量<b data-role="vol">--</b></span>' +
            '<span>指数<b data-role="idx">--</b></span>' +
          '</span>' +
        '</div>' +
        '<div class="main-wrap">' +
          '<div class="sessions-overlay" data-role="sessions"></div>' +
          '<div class="sessions-overlay" data-role="ohlc"></div>' +
          '<div class="chart-main" data-role="main"></div>' +
          '<div class="scale-btns">' +
            '<button data-role="btnA" class="active" title="自动缩放">A</button>' +
            '<button data-role="btnL" title="对数坐标">L</button>' +
          '</div>' +
        '</div>' +
        '<div data-role="subs"></div>';
      main.appendChild(panel);

      var mainEl = panel.querySelector('[data-role="main"]');
      var subEl = panel.querySelector('[data-role="subs"]');
      var mainWrap = panel.querySelector('.main-wrap');
      var sessionsEl = panel.querySelector('[data-role="sessions"]');
      var ohlcEl = panel.querySelector('[data-role="ohlc"]');
      var mc = LightweightCharts.createChart(mainEl, Object.assign({}, BASE_CHART, { width: mainEl.clientWidth || 600, height: mainEl.clientHeight || 520 }));
      var candles = mc.addCandlestickSeries({ upColor: COL.up, downColor: COL.down, borderUpColor: COL.up, borderDownColor: COL.down, wickUpColor: COL.up, wickDownColor: COL.down });
      new ResizeObserver(function () { if (mainEl.clientWidth > 0) { mc.applyOptions({ width: mainEl.clientWidth, height: mainEl.clientHeight }); redrawOverlays(entry); } }).observe(mainEl);

      var btnA = panel.querySelector('[data-role="btnA"]');
      var btnL = panel.querySelector('[data-role="btnL"]');
      var entry = {
        inst: inst, panel: panel, data: [], mainChart: mc, candles: candles,
        subContainer: subEl, mainOverlays: [], subPanes: [], autoScale: true, logScale: false,
        mainWrap: mainWrap, sessionsEl: sessionsEl, sessionsOn: false, ohlcEl: ohlcEl, ohlcOn: false
      };
      mc.timeScale().subscribeVisibleLogicalRangeChange(function () { redrawOverlays(entry); });
      btnA.addEventListener("click", function () {
        entry.autoScale = !entry.autoScale;
        mc.priceScale("right").applyOptions({ autoScale: entry.autoScale });
        btnA.classList.toggle("active", entry.autoScale);
      });
      btnL.addEventListener("click", function () {
        entry.logScale = !entry.logScale;
        mc.priceScale("right").applyOptions({
          mode: entry.logScale ? LightweightCharts.PriceScaleMode.Logarithmic : LightweightCharts.PriceScaleMode.Normal
        });
        btnL.classList.toggle("active", entry.logScale);
      });
      charts.push(entry);
    });
  }

  /* ============ 警报设置（读写 Convex） ============ */
  var CONVEX_URL = "https://efficient-cod-911.convex.cloud";
  var ALERT_SECRET_KEY = "alertSecret";
  var alertEditingId = null;

  function convexError(res) {
    if (res && res.errorData !== undefined && res.errorData !== null) {
      if (typeof res.errorData === "string") return res.errorData;
      try { return JSON.stringify(res.errorData); } catch (e) {}
    }
    var s = String((res && res.errorMessage) || "");
    var m = s.match(/ConvexError:\s*([^\n]+)/) || s.match(/Uncaught Error:\s*([^\n]+)/);
    if (m) return m[1].trim();
    var lines = s.split("\n").map(function (t) { return t.trim(); }).filter(Boolean);
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].indexOf("Server Error") === -1 && lines[i].indexOf("Request ID") === -1 && lines[i].indexOf("at ") !== 0) return lines[i];
    }
    return lines[0] || "请求失败";
  }
  function convexPost(kind, path, args) {
    return fetch(CONVEX_URL + "/api/" + kind, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: path, args: args || {}, format: "json" })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res || res.status !== "success") {
        throw new Error(convexError(res));
      }
      return res.value;
    });
  }
  function convexQuery(path, args) { return convexPost("query", path, args); }
  function convexMutation(path, args) { return convexPost("mutation", path, args); }

  function getSecret() { try { return localStorage.getItem(ALERT_SECRET_KEY) || ""; } catch (e) { return ""; } }
  function setSecret(s) { try { localStorage.setItem(ALERT_SECRET_KEY, s); } catch (e) {} }

  function exLabel(ex) { return ({ gate: "Gate", weex: "WEEX", okx: "OKX" })[ex] || "Gate"; }
  function fmtNum(n) { return (typeof n === "number") ? n.toLocaleString("en-US", { maximumFractionDigits: 6 }) : "-"; }

  function alertMsg(text, kind) {
    var el = document.getElementById("alertMsg");
    el.textContent = text || "";
    el.className = "alert-msg" + (kind ? " " + kind : "");
  }

  function ruleSummary(r) {
    if (r.type === "cross_up") return "价格上破 " + fmtNum(r.price);
    if (r.type === "cross_down") return "价格下破 " + fmtNum(r.price);
    if (r.type === "breakout") {
      var f = r.field === "low" ? "低" : "高";
      var dir = r.dir === "down" ? "下破" : "上破";
      if ((r.indicator || "prev_ohlc") === "prev_session") return "前一时段" + f + dir;
      return "前" + (r.offset || 2) + "根" + (r.tf || "1d") + f + dir;
    }
    return r.type;
  }

  function setDisplay(sel, on) {
    Array.prototype.forEach.call(document.querySelectorAll("#alertBody " + sel), function (el) {
      el.style.display = on ? "flex" : "none";
    });
  }
  function applyTypeVisibility() {
    var breakout = document.getElementById("rfType").value === "breakout";
    var ind = document.getElementById("rfIndicator").value;
    setDisplay(".rf-price", !breakout);
    setDisplay(".rf-break", breakout);
    setDisplay(".rf-tf", breakout && ind === "prev_ohlc");
  }

  function buildAlertForm(r) {
    alertEditingId = r ? r._id : null;
    document.getElementById("rfExchange").value = r ? (r.exchange || "gate") : "gate";
    document.getElementById("rfSymbol").value = r ? r.symbol : "BTC";
    document.getElementById("rfType").value = r ? r.type : "cross_up";
    document.getElementById("rfPrice").value = (r && r.price != null) ? r.price : "";
    document.getElementById("rfIndicator").value = (r && r.indicator) || "prev_ohlc";
    document.getElementById("rfTf").value = (r && r.tf) || "1d";
    document.getElementById("rfOffset").value = (r && r.offset) || 2;
    document.getElementById("rfField").value = (r && r.field) || "high";
    document.getElementById("rfDir").value = (r && r.dir) || "up";
    document.getElementById("rfLabel").value = r ? (r.label || "") : "";
    document.getElementById("rfEnabled").checked = r ? !!r.enabled : true;
    document.getElementById("rfSave").textContent = alertEditingId ? "保存修改" : "添加规则";
    document.getElementById("rfCancel").style.display = alertEditingId ? "block" : "none";
    applyTypeVisibility();
  }

  function ruleToArgs() {
    var secret = getSecret();
    if (!secret) { alertMsg("请先填写写入口令", "err"); return null; }
    var type = document.getElementById("rfType").value;
    var symbol = document.getElementById("rfSymbol").value;
    var rule = {
      exchange: document.getElementById("rfExchange").value,
      symbol: symbol,
      label: document.getElementById("rfLabel").value.trim() || (symbol + "/USDT"),
      type: type,
      enabled: document.getElementById("rfEnabled").checked
    };
    if (type === "breakout") {
      var ind = document.getElementById("rfIndicator").value;
      rule.indicator = ind;
      rule.field = document.getElementById("rfField").value;
      rule.dir = document.getElementById("rfDir").value;
      if (ind === "prev_ohlc") {
        rule.tf = document.getElementById("rfTf").value;
        rule.offset = parseInt(document.getElementById("rfOffset").value, 10) || 2;
      }
    } else {
      var p = parseFloat(document.getElementById("rfPrice").value);
      if (isNaN(p)) { alertMsg("请填写有效价位", "err"); return null; }
      rule.price = p;
    }
    var args = { secret: secret, rule: rule };
    if (alertEditingId) args.id = alertEditingId;
    return args;
  }

  function saveAlertRule() {
    var args = ruleToArgs();
    if (!args) return;
    convexMutation("rulesAdmin:upsertRule", args).then(function () {
      alertMsg("已保存", "ok");
      buildAlertForm(null);
      refreshAlertData();
    }).catch(function (e) { alertMsg(e.message, "err"); });
  }

  function deleteAlertRule(r) {
    if (!window.confirm("删除规则：" + r.label + " " + ruleSummary(r) + " ？")) return;
    convexMutation("rulesAdmin:deleteRule", { secret: getSecret(), id: r._id }).then(function () {
      alertMsg("已删除", "ok"); refreshAlertData();
    }).catch(function (e) { alertMsg(e.message, "err"); });
  }

  function toggleAlertRule(r) {
    convexMutation("rulesAdmin:setEnabled", { secret: getSecret(), id: r._id, enabled: !r.enabled })
      .then(function () { refreshAlertData(); })
      .catch(function (e) { alertMsg(e.message, "err"); });
  }

  function renderRuleList(rules) {
    var list = document.getElementById("ruleList");
    list.innerHTML = "";
    if (!rules || !rules.length) { list.innerHTML = '<div class="alert-empty">暂无规则</div>'; return; }
    rules.forEach(function (r) {
      var row = document.createElement("div"); row.className = "rule-row";
      var d = document.createElement("div"); d.className = "rule-desc";
      d.innerHTML = "[" + exLabel(r.exchange) + "] " + r.label + " · <b>" + ruleSummary(r) + "</b>";
      row.appendChild(d);
      var ops = document.createElement("div"); ops.className = "rule-ops";
      var t = document.createElement("button");
      t.textContent = r.enabled ? "启用中" : "已停用";
      t.className = r.enabled ? "on" : "off";
      t.addEventListener("click", function () { toggleAlertRule(r); });
      ops.appendChild(t);
      var ed = document.createElement("button"); ed.textContent = "编辑";
      ed.addEventListener("click", function () { buildAlertForm(r); alertMsg("编辑中：" + r.label, ""); });
      ops.appendChild(ed);
      var del = document.createElement("button"); del.textContent = "删除";
      del.addEventListener("click", function () { deleteAlertRule(r); });
      ops.appendChild(del);
      row.appendChild(ops);
      list.appendChild(row);
    });
  }

  function renderAlertList(alerts) {
    var el = document.getElementById("alertList");
    el.innerHTML = "";
    if (!alerts || !alerts.length) { el.innerHTML = '<div class="alert-empty">暂无触发</div>'; return; }
    alerts.forEach(function (a) {
      var div = document.createElement("div"); div.className = "alert-item";
      var t = new Date(a.ts * 1000);
      var hh = ("0" + t.getHours()).slice(-2), mm = ("0" + t.getMinutes()).slice(-2);
      var txt = String(a.text || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      var b = document.createElement("b");
      b.textContent = hh + ":" + mm;
      div.appendChild(b);
      div.appendChild(document.createTextNode(" " + txt));
      el.appendChild(div);
    });
  }

  function refreshAlertData() {
    convexQuery("market:rules", {}).then(function (rules) { renderRuleList(rules); })
      .catch(function () { document.getElementById("ruleList").innerHTML = '<div class="alert-empty">读取失败</div>'; });
    convexQuery("market:recentAlerts", { limit: 20 }).then(function (alerts) { renderAlertList(alerts); })
      .catch(function () {});
  }

  function openAlert() {
    document.getElementById("alertSecret").value = getSecret();
    document.getElementById("alertMask").classList.add("show");
    alertMsg("");
    buildAlertForm(null);
    refreshAlertData();
  }
  function closeAlert() { document.getElementById("alertMask").classList.remove("show"); }

  function wireAlertUI() {
    document.getElementById("btnAlert").addEventListener("click", openAlert);
    document.getElementById("alertClose").addEventListener("click", closeAlert);
    document.getElementById("alertMask").addEventListener("click", function (e) { if (e.target.id === "alertMask") closeAlert(); });
    document.getElementById("alertSecret").addEventListener("change", function () { setSecret(this.value.trim()); });
    document.getElementById("rfType").addEventListener("change", applyTypeVisibility);
    document.getElementById("rfIndicator").addEventListener("change", applyTypeVisibility);
    document.getElementById("rfSave").addEventListener("click", saveAlertRule);
    document.getElementById("rfCancel").addEventListener("click", function () { buildAlertForm(null); alertMsg(""); });
  }

  wireAlertUI();
  buildToolbar();
  buildTabs();
  buildPanels();
  rebuildAllIndicators();
  reloadAll();
  setActiveInst(state.activeInst);
  wsConnect();
})();
</script>
</body>
