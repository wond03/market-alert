<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="google" content="notranslate" />
<title translate="no">BTC / XAU 合约看盘</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b22; --border: #232a33; --text: #d1d9e0;
    --muted: #7d8590; --up: #26a69a; --down: #ef5350; --accent: #2962ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 7px 12px; border-bottom: 1px solid var(--border); flex: none;
    background: rgba(14,17,23,0.94); backdrop-filter: blur(6px); z-index: 10; flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .group { display: flex; align-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .group .lbl { font-size: 11px; color: var(--muted); padding: 0 6px 0 4px; }
  .group button { background: transparent; color: var(--muted); border: 0; padding: 5px 10px;
    border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .group button.active { background: var(--accent); color: #fff; }
  .group button:hover:not(.active) { color: var(--text); }
  .btn-settings { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .btn-settings:hover { border-color: var(--accent); }
  .tf-select { display: none; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 8px; font-size: 12px; font-weight: 600; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 6px var(--up); }
  .dot.off { background: var(--down); box-shadow: 0 0 6px var(--down); }
  main { flex: 1; min-height: 0; display: flex; padding: 8px 10px; }
  .panel { display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow-y: auto; flex-direction: column; flex: 1; min-height: 0; }
  .panel.active { display: flex; }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 6px 12px 4px; flex-wrap: wrap; flex: none; }
  .sym { font-size: 12px; font-weight: 700; }
  .sym small { font-size: 10px; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .price { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chg { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }
  .stats { display: flex; gap: 10px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .stats b { color: var(--text); font-weight: 600; margin-left: 2px; }
  .main-wrap { position: relative; flex: 1; min-height: 200px; display: flex; flex-direction: column; background: var(--panel); }
  .chart-main { position: relative; z-index: 1; width: 100%; flex: 1; min-height: 0; touch-action: none; }
  .sessions-overlay { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .sbox { position: absolute; box-sizing: border-box; }
  .slabel { position: absolute; font-size: 10px; font-weight: 600; white-space: nowrap; text-shadow: 0 0 3px rgba(0,0,0,0.9); }
  .sline { position: absolute; height: 0; border-top: 1px dashed; }
  .snode { position: absolute; font-size: 9px; white-space: nowrap; }
  .smc-fill { position: absolute; box-sizing: border-box; pointer-events: none; }
  .smc-fvg { position: absolute; box-sizing: border-box; border-left: 1px solid; border-right: 1px solid; pointer-events: none; }
  .smc-line { position: absolute; height: 0; pointer-events: none; }
  .smc-swing { position: absolute; font-size: 9px; font-weight: 700; line-height: 1; transform: translate(-50%, -50%); text-shadow: 0 0 3px rgba(0,0,0,0.9); pointer-events: none; }
  .smc-sweep { position: absolute; font-size: 9px; font-weight: 700; line-height: 1; transform: translate(-50%, -50%); text-shadow: 0 0 3px rgba(0,0,0,0.9); pointer-events: none; }
  .smc-tag { position: absolute; font-size: 9px; line-height: 1.3; white-space: nowrap; padding: 0 2px; border-radius: 2px; pointer-events: none; }
  .smc-info { position: absolute; left: 6px; top: 4px; font-size: 10px; font-weight: 600; white-space: nowrap; text-shadow: 0 0 3px rgba(0,0,0,0.9); pointer-events: none; z-index: 2; }
  .scale-btns { position: absolute; right: 5px; bottom: 4px; display: flex; flex-direction: row; gap: 8px; z-index: 5; }
  .scale-btns button { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--border); background: rgba(22,27,34,0.85); color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; line-height: 1; padding: 0; }
  .scale-btns button:hover { color: var(--text); }
  .scale-btns button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rt-btn { position: absolute; right: 8px; bottom: 34px; z-index: 6; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: rgba(22,27,34,0.9); color: var(--text); cursor: pointer; font-size: 15px; line-height: 1; display: none; align-items: center; justify-content: center; padding: 0; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .rt-btn.show { display: flex; }
  .rt-btn:hover { color: #fff; border-color: var(--accent); }
  .chart-sub { width: 100%; height: 120px; flex: none; border-top: 1px solid var(--border); touch-action: none; }
  footer { text-align: center; color: var(--muted); font-size: 10px; padding: 4px 0 6px; flex: none; }
  @media (max-width: 720px) {
    header h1 { display: none; }
    header { padding: 6px 8px; gap: 6px; }
    #tfGroup { display: none; }
    .tf-select { display: block; }
    .group { padding: 2px; }
    .group button { padding: 4px 8px; font-size: 11px; }
    .btn-settings { padding: 5px 10px; font-size: 11px; }
    #statusText { display: none; }
    .stats { display: none; }
    .panel-head { padding: 5px 8px 3px; gap: 6px; }
    main { padding: 6px; }
    footer { display: none; }
  }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .mask.show { display: flex; }
  .modal { background: #161b22; border: 1px solid var(--border); border-radius: 12px; width: 560px; max-width: 100%; max-height: 86vh; display: flex; flex-direction: column; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .modal-head span { font-weight: 700; }
  .modal-head .actions { display: flex; gap: 8px; }
  .modal-head button { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .modal-head button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal-body { padding: 8px 18px 18px; overflow-y: auto; }
  .ind-row { border-bottom: 1px solid var(--border); padding: 9px 0; }
  .ind-row:last-child { border-bottom: 0; }
  .ind-title { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; user-select: none; }
  .ind-title input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .ind-title em { font-style: normal; font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
  .caret { margin-left: auto; font-size: 10px; color: var(--muted); transition: transform .15s; }
  .caret::before { content: "\25B8"; }
  .ind-row:not(.collapsed) > .ind-title > .caret { transform: rotate(90deg); }
  .ind-row.collapsed > .ind-body { display: none; }
  .params { margin: 8px 0 0 24px; }
  .params label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .params input { width: 64px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
  .params select { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
  .params input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); padding: 0; }
  .params input[type="color"] { width: 42px; height: 26px; padding: 1px; }
  .params input[type="time"] { width: 96px; }
  .params input[type="text"] { width: 160px; }
  .param-group { width: 100%; font-size: 12px; font-weight: 700; color: var(--text); margin: 10px 0 0; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .param-box { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 0; }
  /* 作战面板辅助 */
  .bt-note { margin-top: 12px; font-size: 11px; line-height: 1.7; color: var(--muted); }
  .bt-bad { color: #ff6b6b; }

  /* SMC 作战面板 */
  .modal.battle { width: 660px; }
  .bt-form { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .bt-form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
  .bt-form select { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 5px 8px; font-size: 12px; }
  .bt-state { margin-top: 12px; font-size: 13px; font-weight: 700; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); color: var(--text); }
  .bt-state.bull { color: var(--up); border-color: var(--up); }
  .bt-state.bear { color: var(--down); border-color: var(--down); }
  .bt-blk { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .bt-blk-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 5px; display: flex; justify-content: space-between; align-items: baseline; }
  .bt-blk-title .bt-tag { font-weight: 600; color: var(--muted); font-size: 11px; }
  .bt-row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 12px; }
  .bt-row .bt-k { color: var(--muted); }
  .bt-row .bt-v { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bt-v.up { color: var(--up); } .bt-v.down { color: var(--down); }
  .bt-zone { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 0; font-size: 12px; border-bottom: 1px dashed var(--border); }
  .bt-zone:last-child { border-bottom: 0; }
  .bt-ztype { font-weight: 700; }
  .bt-ztype.bull { color: var(--up); } .bt-ztype.bear { color: var(--down); }
  .bt-badge { display: inline-block; padding: 0 6px; border-radius: 6px; font-size: 11px; border: 1px solid var(--border); color: var(--muted); margin-left: 6px; }
  .bt-badge.ok { color: #4caf50; border-color: #4caf50; }
  .bt-badge.warn { color: #ff6b6b; border-color: #ff6b6b; }
  .bt-chk { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; font-size: 12px; }
  .bt-chk .bt-mark { width: 14px; flex: none; text-align: center; font-weight: 700; }
  .bt-chk.ok .bt-mark { color: #4caf50; } .bt-chk.warn .bt-mark { color: #ffb300; } .bt-chk.na .bt-mark { color: var(--muted); }
  .bt-chk .bt-q { color: var(--muted); } .bt-chk .bt-a { color: var(--text); font-weight: 600; }
  .bt-rec { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .bt-rec-col { flex: 1 1 320px; min-width: 260px; }
  .bt-rec-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .bt-rec-list { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow: auto; }
  .bt-rec-item { font-size: 12px; padding: 5px 8px; border-radius: 6px; background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    font-variant-numeric: tabular-nums; }
  .bt-rec-item b { color: var(--text); font-weight: 700; }
  .bt-rec-sub { color: var(--muted); font-size: 11px; }
</style>
</head>
<body class="notranslate">
<header>
  <h1>合约看盘 · BTC / XAU</h1>
  <div class="toolbar">
    <div class="group" id="tabs"></div>
    <div class="group" id="exGroup"></div>
    <div class="group" id="tfGroup"></div>
    <select id="tfSelect" class="tf-select"></select>
    <button class="btn-settings" id="btnSettings">指标设置</button>
    <button class="btn-settings" id="btnBattle">作战面板</button>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">连接中…</span></div>
  </div>
</header>
<main id="main"></main>
<footer>数据来源：Gate / WEEX / OKX 永续合约公开接口（自用）。行情仅供参考，不构成投资建议。</footer>

<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-head">
      <span>指标设置</span>
      <div class="actions">
        <button id="btnReset">重置默认</button>
        <button class="primary" id="btnClose">完成</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="mask" id="battleMask">
  <div class="modal battle">
    <div class="modal-head">
      <span>SMC 作战面板</span>
      <div class="actions">
        <button id="btRefresh">刷新</button>
        <button class="primary" id="btClose">完成</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="bt-form">
        <label>背景周期 <select id="btHtf"><option value="4h">4时</option><option value="1h" selected>1时</option></select></label>
        <label>方向 / 区域周期 <select id="btMtf"><option value="1h">1时</option><option value="15m" selected>15分</option><option value="5m">5分</option></select></label>
        <label>入场周期 <select id="btLtf"><option value="15m">15分</option><option value="5m" selected>5分</option><option value="1m">1分</option></select></label>
      </div>
      <div id="btResult"><div class="bt-note">加载中…</div></div>
      <div class="bt-note">
        按脚本逐步展示当前状态：<b>1h 定背景 → 15m 结构定日内方向 → OB/FVG 找入区 → 价格进入入区即提示 → 区域外止损 → 日内流动性/前高前低止盈</b>。
        只描述结构与位置，不构成投资建议。
      </div>
      <div class="bt-rec">
        <div class="bt-rec-col">
          <div class="bt-rec-title">最近信号</div>
          <div id="btSigList" class="bt-rec-list"><div class="bt-note" style="margin:0">加载中…</div></div>
        </div>
        <div class="bt-rec-col">
          <div class="bt-rec-title">最近了结（止盈 / 止损记录）</div>
          <div id="btOutList" class="bt-rec-list"><div class="bt-note" style="margin:0">加载中…</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
  "use strict";

  var BARS = 400;

  var INSTRUMENTS = [
    { label: "BTC/USDT", sub: "永续", sym: { gate: "BTC_USDT", weex: "BTCUSDT", okx: "BTC-USDT-SWAP" } },
    { label: "XAU/USDT", sub: "永续", sym: { gate: "XAU_USDT", weex: "XAUUSDT", okx: "XAU-USDT-SWAP" } }
  ];
  var INTERVALS = [
    { key: "1m", label: "1分" }, { key: "5m", label: "5分" },
    { key: "15m", label: "15分" }, { key: "1h", label: "1时" },
    { key: "4h", label: "4时" }, { key: "1d", label: "日" }
  ];
  /* TradingView 默认配色 */
  var COL = {
    up: "#26a69a", down: "#ef5350",
    m1: "#2962FF", m2: "#FF6D00", m3: "#F23645",
    bollUp: "#787B86", bollMid: "#FF6D00", bollLow: "#787B86",
    macd: "#2962FF", signal: "#FF6D00",
    rsi: "#7E57C2", k: "#2962FF", d: "#FF6D00", j: "#7E57C2",
    guide: "rgba(120,123,134,0.6)"
  };
  var SOURCE_OPTS = [
    { value: "close", label: "收盘价 close" },
    { value: "open", label: "开盘价 open" },
    { value: "high", label: "最高价 high" },
    { value: "low", label: "最低价 low" },
    { value: "hl2", label: "(high+low)/2" },
    { value: "hlc3", label: "(high+low+close)/3" },
    { value: "ohlc4", label: "(open+high+low+close)/4" }
  ];
  var MATYPE_OPTS = [
    { value: "SMA", label: "SMA 简单" },
    { value: "EMA", label: "EMA 指数" },
    { value: "WMA", label: "WMA 加权" },
    { value: "RMA", label: "RMA 平滑(Wilder)" }
  ];
  var LINE_STYLE_OPTS = [
    { value: "solid", label: "实线" },
    { value: "dashed", label: "虚线" },
    { value: "dotted", label: "点线" }
  ];

  var state = { exchange: "gate", interval: "15m", activeInst: 0 };

  /* ================= 交易所适配器 ================= */
  /* 统一输出：candle = { time(秒), open, high, low, close, volume }
               tick   = { contract, last, changePct, high24, low24, vol24(USDT), index }
     新增交易所：在 EXCHANGES 加一条，并在 INSTRUMENTS[].sym 补上该所代码即可。 */
  var EXCHANGE_ORDER = ["gate", "weex", "okx"];
  var EXCHANGES = {
    gate: {
      label: "Gate", maxBars: 400,
      interval: function (iv) { return iv; },
      wsUrl: "wss://fx-ws.gateio.ws/v4/ws/usdt",
      fetchCandles: function (contract, iv, limit) {
        var url = "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=" +
          contract + "&interval=" + iv + "&limit=" + limit;
        return fetch(url, { cache: "no-store" }).then(okJson).then(function (raw) {
          return (raw || []).map(function (c) {
            return { time: Math.floor(Number(c.t)), open: +c.o, high: +c.h, low: +c.l, close: +c.c, volume: +c.v };
          }).filter(validCandle);
        });
      },
      onOpen: function (send, contracts, iv) {
        send({ time: nowSec(), channel: "futures.tickers", event: "subscribe", payload: contracts });
        contracts.forEach(function (k) {
          send({ time: nowSec(), channel: "futures.candlesticks", event: "subscribe", payload: [iv, k] });
        });
      },
      onUnsubCandles: function (send, contracts, iv) {
        contracts.forEach(function (k) {
          send({ time: nowSec(), channel: "futures.candlesticks", event: "unsubscribe", payload: [iv, k] });
        });
      },
      onMessage: function (msg, h) {
        if (msg.event !== "update") return;
        if (msg.channel === "futures.tickers") {
          (msg.result || []).forEach(function (t) {
            h.tick({ contract: t.contract, last: +t.last, changePct: +t.change_percentage,
              high24: +t.high_24h, low24: +t.low_24h, vol24: +t.volume_24h_settle, index: +t.index_price });
          });
        } else if (msg.channel === "futures.candlesticks") {
          (msg.result || []).forEach(function (c) {
            var name = String(c.n || ""), us = name.indexOf("_");
            if (us < 0) return;
            if (name.slice(0, us) !== state.interval) return;
            h.candle({ contract: name.slice(us + 1), time: Math.floor(Number(c.t)),
              open: +c.o, high: +c.h, low: +c.l, close: +c.c, volume: +c.v });
          });
        }
      }
    },
    weex: {
      label: "WEEX", maxBars: 400,
      interval: function (iv) { return iv; },
      wsUrl: "wss://ws-contract.weex.com/v3/ws/public",
      fetchCandles: function (contract, iv, limit) {
        var url = "https://api-contract.weex.com/capi/v3/market/klines?symbol=" +
          contract + "&interval=" + iv + "&limit=" + limit;
        return fetch(url, { cache: "no-store" }).then(okJson).then(function (raw) {
          return (raw || []).map(function (r) {
            return { time: Math.floor(Number(r[0]) / 1000), open: +r[1], high: +r[2], low: +r[3], close: +r[4], volume: +r[5] };
          }).filter(validCandle);
        });
      },
      onOpen: function (send, contracts, iv) {
        var params = [];
        contracts.forEach(function (k) { params.push(k + "@ticker"); });
        contracts.forEach(function (k) { params.push(k + "@kline_" + iv + "_LAST_PRICE"); });
        send({ method: "SUBSCRIBE", params: params, id: 1 });
      },
      onUnsubCandles: function (send, contracts, iv) {
        send({ method: "UNSUBSCRIBE", params: contracts.map(function (k) { return k + "@kline_" + iv + "_LAST_PRICE"; }), id: 2 });
      },
      onMessage: function (msg, h) {

  function applyCandle(c) {
    var entry = findEntry(c.contract);

    var candle = {
      time: Number(c.time), open: Number(c.open), high: Number(c.high),
      low: Number(c.low), close: Number(c.close), volume: Number(c.volume)

    if (!isFinite(candle.time) || !isFinite(candle.close)) return;
    var arr = entry.data;
    // lightweight-charts 的 series.update 只接受「最后一根」或更新的蜡烛，
    // 早于最后一根的历史/乱序数据一律丢弃，避免抛 "Cannot update oldest data"。
    if (arr.length && candle.time < arr[arr.length - 1].time) return;
    if (arr.length && candle.time === arr[arr.length - 1].time) arr[arr.length - 1] = candle;
    else arr.push(candle);

    }

    var m = s.match(/ConvexError:\s*([^\n]+)/) || s.match(/Uncaught Error:\s*([^\n]+)/);
    if (m) return m[1].trim();
    var lines = s.split("\n").map(function (t) { return t.trim(); }).filter(Boolean);
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].indexOf("Server Error") === -1 && lines[i].indexOf("Request ID") === -1 && lines[i].indexOf("at ") !== 0) return lines[i];

    return lines[0] || "请求失败";

    out.push('<div class="bt-blk"><div class="bt-blk-title">日内方向 <span class="bt-tag">BOS / CHoCH</span></div>' +
      row("方向周期", btIvLabel(x.mtfIv)) +
      row("背景周期（" + btIvLabel(x.htfIv) + "）", bgCn, x.bg === "bull" ? "up" : x.bg === "bear" ? "down" : "") +
      row("最近结构事件", bl, x.lastBreak ? (x.lastBreak.dir === "bull" ? "up" : "down") : "") +
      row("失效线（结构腿" + (up ? "低" : "高") + "）", legLv == null ? "—" : f(legLv)) +
      (pct != null ? row("区间位置", (pct > 0.55 ? "溢价" : pct < 0.45 ? "折价" : "均衡") + " " + Math.round(pct * 100) + "%") : "") +
      ((up || dn) ? row("流动性背景", x.sweep.swept ? ("已扫前" + (up ? "低" : "高") + " " + f(x.sweep.level) + "（更高质量）") : "无明显扫荡", x.sweep.swept ? "up" : "") : "") +
      "</div>");

    var zHtml = "";
    if (!x.zones.length) zHtml = '<div class="bt-note" style="margin-top:0">无顺方向、未缓解且带位移的 OB / FVG 区域。</div>';
    x.zones.forEach(function (z) {
      var distPct = (z.dist / x.price * 100).toFixed(2);
      zHtml += '<div class="bt-zone"><span><span class="bt-ztype ' + z.bias + '">' + z.kind + "</span> " + z.side + " " + f(z.bottom) + "–" + f(z.top) +
        (z.fresh ? '<span class="bt-badge ok">新鲜</span>' : '<span class="bt-badge warn">已测试 ' + z.touched + "</span>") +
        (z.overlap ? '<span class="bt-badge">OB/FVG 重叠</span>' : "") +
        '</span><span class="bt-v">距现价 ' + distPct + "%</span></div>";
    });
    out.push('<div class="bt-blk"><div class="bt-blk-title">入区（OB / FVG） <span class="bt-tag">' + btIvLabel(x.mtfIv) + '</span></div>' + zHtml + "</div>");

    out.push('<div class="bt-blk"><div class="bt-blk-title">低周期确认 <span class="bt-tag">' + btIvLabel(x.ltfIv) + '</span></div>' +
      row("当前状态", x.trig.state, x.trig.tone) +
      row("低周期最近结构", x.trig.ltfBreak ? (x.trig.ltfBreak.tag + " " + (x.trig.ltfBreak.dir === "bull" ? "上" : "下")) : "—") +
      row("确认信号", x.trig.confirmed ? ("有（" + x.trig.kind + "）") : "无（需低周期同向确认才提示）") +
      "</div>");

    var r = x.risk;
    out.push('<div class="bt-blk"><div class="bt-blk-title">风控执行 <span class="bt-tag">' + (up ? "做多剧本" : dn ? "做空剧本" : "—") + '</span></div>' +
      (r ? row("入场", f(r.entry)) +
        row("止损（区域外）", f(r.stop) + "（" + (r.stopPct * 100).toFixed(2) + "%）") +
        row("止盈（结构/日内流动性）", r.target == null ? "—" : f(r.target)) +
        row("盈亏比", r.rr == null ? "—" : "1:" + r.rr.toFixed(2), r.rr != null && r.rr >= 2 ? "up" : "down")
        : '<div class="bt-note" style="margin-top:0">无可用区域，暂不给执行参数。</div>') +
      "</div>");

    var chk = [];
    function ck(ok, q, a) { chk.push('<div class="bt-chk ' + (ok === true ? "ok" : ok === false ? "warn" : "na") + '"><span class="bt-mark">' + (ok === true ? "✓" : ok === false ? "!" : "·") + '</span><span><span class="bt-q">' + btEsc(q) + '</span> <span class="bt-a">' + btEsc(a) + "</span></span></div>"); }
    ck(up || dn, "日内方向（" + btIvLabel(x.mtfIv) + "）", up ? "看涨，入区与它同向" : dn ? "看跌，入区与它同向" : "震荡，无明确方向");
    ck(x.lastBreak ? x.dirFresh : false, "结构事件（" + btIvLabel(x.mtfIv) + "）", x.lastBreak ? (x.lastBreak.tag + " " + (x.lastBreak.dir === "bull" ? "向上" : "向下") + "破 " + f(x.lastBreak.level) + (x.dirFresh ? "，在今日内，方向已确认" : "，早于今日，已失效")) : "—");
    ck(x.bg !== "range", "背景（" + btIvLabel(x.htfIv) + "）", x.bg === "bull" ? "看涨（与日内方向呼应更佳）" : x.bg === "bear" ? "看跌（与日内方向呼应更佳）" : "震荡，仅作参考");
    ck(x.zones.length > 0, "入区（方向周期 " + btIvLabel(x.mtfIv) + "）", x.zones.length ? (x.zones[0].kind + " " + f(x.zones[0].bottom) + "–" + f(x.zones[0].top) + "（未缓解、未被价格吃掉" + (x.zones[0].overlap ? "，与另一类重叠" : "") + "）") : "无");
    ck(x.zones.length ? x.zones[0].fresh : null, "区域是否新鲜（方向周期 " + btIvLabel(x.mtfIv) + "）", x.zones.length ? (x.zones[0].fresh ? "是（未被测试过）" : "否（已测试 " + x.zones[0].touched + " 次）") : "—");
    ck(x.lastBreak ? x.dirDisp : null, "方向位移（" + btIvLabel(x.mtfIv) + "）", x.lastBreak ? (x.dirDisp ? "有（≥1.5×ATR 同向位移）" : "不足（1.5×ATR 未达标 → 方向不明确，观望）") : "—");
    ck((up || dn) ? x.sweep.swept : null, "流动性（背景周期 " + btIvLabel(x.htfIv) + "）", (up || dn) ? (x.sweep.swept ? ("已扫前" + (up ? "低" : "高") + " " + f(x.sweep.level) + "，属更高质量背景") : "未扫到前高/前低，属一般背景") : "—");
    ck(x.trig.internalKind ? true : (up||dn ? false : null), "确认 1 · " + btIvLabel(x.mtfIv) + " 内部结构", x.trig.internalKind ? (x.trig.internalKind + "，回调结束") : "暂无（需 15m 内部反向结构确认回调结束）");
  ck(x.trig.confirmed ? true : null, "确认 2 · " + btIvLabel(x.ltfIv) + " 触发", x.trig.confirmed ? (x.trig.kind + "，出现在区域内") : "暂无（需 5m 扣扳机，两层未全不提示）");
    ck(r ? true : null, "止损（方向周期 " + btIvLabel(x.mtfIv) + "）", r ? (f(r.stop) + "，在区域外（0.2×ATR 缓冲）") : "—");
    ck(r && r.rr != null ? (r.rr >= 2) : null, "盈亏比（方向周期 " + btIvLabel(x.mtfIv) + "）", r && r.rr != null ? ("1:" + r.rr.toFixed(2) + (r.rr < 2 ? "（低于 1:2，偏薄）" : "")) : "—");
    out.push('<div class="bt-blk"><div class="bt-blk-title">交易前检查清单</div>' + chk.join("") + "</div>");

    el.innerHTML = out.join("");
  }
  function btResultLabel(r) { return r === "target" ? "到止盈" : r === "stop" ? "扫止损" : r === "cancel" ? "被取代" : btEsc(r); }
  function btNum(n, dp) { return (n == null || !isFinite(n)) ? "—" : fmt(n, dp); }
  function btDp(sym) { return sym === "BTC" ? 1 : 2; }
  function btTimeCell(ts) {
    var t = new Date(ts * 1000);
    return (t.getMonth() + 1) + "/" + t.getDate() + " " + ("0" + t.getHours()).slice(-2) + ":" + ("0" + t.getMinutes()).slice(-2);
  }
  function renderBattleSignals(rows) {
    var el = document.getElementById("btSigList");
    if (!rows || !rows.length) { el.innerHTML = '<div class="bt-note" style="margin:0">暂无信号</div>'; return; }
    el.innerHTML = rows.map(function (s) {
      var dp = btDp(s.symbol), long = s.bias === "long";
      var rr = (s.rr == null) ? "—" : "1:" + s.rr.toFixed(2);
      var resTone = s.result === "target" ? "up" : s.result === "stop" ? "down" : "";
      var res = s.result ? ' <span class="' + resTone + '">' + btResultLabel(s.result) + '</span>' : "";
      return '<div class="bt-rec-item"><span><b>' + btTimeCell(s.sigTs) + '</b> ' + btEsc(s.symbol) +
        ' <span class="' + (long ? "up" : "down") + '">' + (long ? "多" : "空") + '</span>' +
        ' <span class="bt-rec-sub">' + btEsc(s.zoneKind || "") + '</span>' + res + '</span>' +
        '<span>入' + btNum(s.entryPrice, dp) + ' 损' + btNum(s.stopPrice, dp) + ' 盈' + btNum(s.targetPrice, dp) +
        ' <b>' + rr + '</b></span></div>';
    }).join("");
  }
  function renderBattleOutcomes(rows) {
    var el = document.getElementById("btOutList");
    if (!rows || !rows.length) { el.innerHTML = '<div class="bt-note" style="margin:0">暂不了结记录</div>'; return; }
    el.innerHTML = rows.map(function (o) {
      var dp = btDp(o.symbol), long = o.bias === "long";
      var tone = o.result === "target" ? "up" : o.result === "stop" ? "down" : "";
      return '<div class="bt-rec-item"><span><b>' + btTimeCell(o.closedTs) + '</b> ' + btEsc(o.symbol) +
        ' <span class="' + (long ? "up" : "down") + '">' + (long ? "多" : "空") + '</span></span>' +
        '<span><span class="' + tone + '">' + btResultLabel(o.result) + '</span> 入' + btNum(o.entryPrice, dp) +
        ' → 结' + btNum(o.exitPrice, dp) + ' <span class="bt-rec-sub">损' + btNum(o.stopPrice, dp) +
        ' 盈' + btNum(o.targetPrice, dp) + '</span></span></div>';
    }).join("");
  }
  function refreshBattleRecords() {
    convexQuery("battle:recentBattleSignals", { limit: 20 }).then(renderBattleSignals)
      .catch(function () { document.getElementById("btSigList").innerHTML = '<div class="bt-note" style="margin:0">读取失败</div>'; });
    convexQuery("battle:recentBattleOutcomes", { limit: 20 }).then(renderBattleOutcomes)
      .catch(function () { document.getElementById("btOutList").innerHTML = '<div class="bt-note" style="margin:0">读取失败</div>'; });
  }
  function runBattle() {
    var htfIv = document.getElementById("btHtf").value;
    var mtfIv = document.getElementById("btMtf").value;
    var ltfIv = document.getElementById("btLtf").value;
    btState = { htf: htfIv, mtf: mtfIv, ltf: ltfIv };
    btSave(btState);
    var inst = INSTRUMENTS[state.activeInst];
    var contract = inst.sym[state.exchange];
    var el = document.getElementById("btResult");
    el.innerHTML = '<div class="bt-note">加载中…</div>';
    Promise.all([
      btFetch(contract, htfIv, 500),
      btFetch(contract, mtfIv, 500),
      btFetch(contract, ltfIv, 500)
    ]).then(function (arr) {
      if (arr[0].length < 60 || arr[1].length < 60 || arr[2].length < 30) { el.innerHTML = '<div class="bt-note bt-bad">K 线数据不足，无法计算。</div>'; return; }
      convexAction("panel:battleStatus", { htf: candlesToApi(arr[0]), mtf: candlesToApi(arr[1]), ltf: candlesToApi(arr[2]), now: Math.floor(Date.now() / 1000) })
   .then(function (st) { renderBattle(btDecorate(st, htfIv, mtfIv, ltfIv, inst.label)); })
   .catch(function (e) { el.innerHTML = '<div class="bt-note bt-bad">计算失败：' + btEsc(e.message) + "</div>"; });
    }).catch(function (e) {
      el.innerHTML = '<div class="bt-note bt-bad">加载失败：' + btEsc(e.message) + "</div>";
    });
  }
  function openBattle() {
    document.getElementById("btHtf").value = btState.htf || "1h";
    document.getElementById("btMtf").value = btState.mtf || "15m";
    document.getElementById("btLtf").value = btState.ltf || "5m";
    document.getElementById("battleMask").classList.add("show");
    runBattle();
    refreshBattleRecords();
  }
  function wireBattleUI() {
    document.getElementById("btnBattle").addEventListener("click", openBattle);
    document.getElementById("btClose").addEventListener("click", function () { document.getElementById("battleMask").classList.remove("show"); });
    document.getElementById("battleMask").addEventListener("click", function (e) { if (e.target.id === "battleMask") document.getElementById("battleMask").classList.remove("show"); });
    document.getElementById("btRefresh").addEventListener("click", function () { runBattle(); refreshBattleRecords(); });
    document.getElementById("btHtf").addEventListener("change", runBattle);
    document.getElementById("btMtf").addEventListener("change", runBattle);
    document.getElementById("btLtf").addEventListener("change", runBattle);
  }

  window.addEventListener("beforeunload", captureViewBars);
  window.__md = { get charts() { return charts; }, state: state, getViewBars: function () { return viewBars; } };
  wireBattleUI();
  buildToolbar();
  buildTabs();
  buildPanels();
  rebuildAllIndicators();
  reloadAll();
  setActiveInst(state.activeInst);
  wsConnect();
})();
</script>
</body>
</html>
